<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verofit Bestellformular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-wrapper {
            padding: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h2 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .required::after {
            content: " *";
            color: #e74c3c;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .products-section {
            margin-top: 2rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .product-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .original-price {
            font-size: 0.85rem;
            color: #999;
            text-decoration: line-through;
        }

        .discounted-price {
            font-weight: bold;
            color: #e74c3c;
            font-size: 1.2rem;
        }

        .discount-badge {
            background: #e74c3c;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .quantity-input {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-input input {
            width: 60px;
            text-align: center;
        }

        .quantity-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        .quantity-button:hover {
            background: #764ba2;
        }

        .summary-section {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            border-top: 2px solid #ddd;
            padding-top: 0.75rem;
            margin-top: 1rem;
        }

        .form-submit {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button[type="submit"],
        button[type="reset"] {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="reset"] {
            background: #ddd;
            color: #333;
        }

        button[type="reset"]:hover {
            background: #ccc;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }

        .error .error-message {
            display: block;
        }

        .error input,
        .error select {
            border-color: #e74c3c;
        }

        .notice {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .notice i {
            color: #3498db;
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        noscript {
            background: #e74c3c;
            color: white;
            padding: 1rem;
            border-radius: 5px;
            display: block;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .form-wrapper {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <noscript>
        <div class="notice">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>Dieses Formular benötigt Javascript, um korrekt zu funktionieren. Bitte aktivieren Sie Javascript in den Einstellungen Ihres Browsers.</div>
        </div>
    </noscript>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-shopping-bag"></i> Verofit Bestellformular</h1>
            <p>Vereins-Sammelbestellung</p>
        </div>

        <div class="form-wrapper">
            <div class="notice">
                <i class="fa-solid fa-info"></i>
                <div>Alle Preise enthalten 29% Rabatt auf die Originalpreise von Verofit.</div>
            </div>

            <form id="verofit-form">
                <!-- Persönliche Angaben -->
                <div class="form-section">
                    <h2><i class="fa-solid fa-user"></i> Persönliche Angaben</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName" class="required">Vorname</label>
                            <input type="text" id="firstName" name="firstName" required>
                            <span class="error-message">Vorname ist erforderlich</span>
                        </div>
                        <div class="form-group">
                            <label for="lastName" class="required">Nachname</label>
                            <input type="text" id="lastName" name="lastName" required>
                            <span class="error-message">Nachname ist erforderlich</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="team" class="required">Team</label>
                            <select id="team" name="team" required>
                                <option value="">-- Bitte wählen --</option>
                                <option value="1-mannschaft">1. Mannschaft</option>
                                <option value="2-mannschaft">2. Mannschaft</option>
                                <option value="damen">Damen</option>
                                <option value="u18">U18</option>
                                <option value="u15">U15</option>
                                <option value="u12">U12</option>
                                <option value="u9">U9</option>
                            </select>
                            <span class="error-message">Team ist erforderlich</span>
                        </div>
                        <div class="form-group">
                            <label for="email">E-Mail (optional)</label>
                            <input type="email" id="email" name="email">
                        </div>
                    </div>
                </div>

                <!-- Produkte -->
                <div class="form-section products-section">
                    <h2><i class="fa-solid fa-box"></i> Produkte</h2>

                    <div class="products-grid" id="products-grid">
                        <!-- Produkte werden hier durch JavaScript eingefügt -->
                    </div>
                </div>

                <!-- Zusammenfassung -->
                <div class="summary-section">
                    <div class="summary-row">
                        <span>Anzahl Artikel:</span>
                        <span id="total-items">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Gesamtpreis:</span>
                        <span id="total-price">CHF 0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Zu zahlender Betrag:</span>
                        <span id="final-price">CHF 0.00</span>
                    </div>
                </div>

                <!-- Bemerkungen -->
                <div class="form-section">
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="remarks">Bemerkungen</label>
                            <textarea id="remarks" name="remarks" rows="4" placeholder="Zusätzliche Informationen oder Wünsche..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="form-submit">
                    <button type="submit">
                        <i class="fa-solid fa-check"></i> Bestellung abschicken
                    </button>
                    <button type="reset">
                        <i class="fa-solid fa-redo"></i> Zurücksetzen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Produkte mit Originalpreis (die Preise sind Beispiele - bitte anpassen!)
        const products = [
            { id: 1, name: "Trainingstrikot", originalPrice: 45.00 },
            { id: 2, name: "Trainingshose", originalPrice: 55.00 },
            { id: 3, name: "Sporttasche", originalPrice: 65.00 },
            { id: 4, name: "Trainingshandschuhe", originalPrice: 35.00 },
            { id: 5, name: "Stirnband", originalPrice: 18.00 },
            { id: 6, name: "Socken (3er Pack)", originalPrice: 25.00 },
            { id: 7, name: "Jacke", originalPrice: 85.00 },
            { id: 8, name: "Funktionsshirt", originalPrice: 42.00 }
        ];

        const DISCOUNT_PERCENT = 29;

        function calculateDiscountedPrice(originalPrice) {
            return originalPrice * (1 - DISCOUNT_PERCENT / 100);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('de-CH', {
                style: 'currency',
                currency: 'CHF'
            }).format(price);
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const discountedPrice = calculateDiscountedPrice(product.originalPrice);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">
                        <div>
                            <div class="original-price">${formatPrice(product.originalPrice)}</div>
                            <div class="discounted-price">${formatPrice(discountedPrice)}</div>
                        </div>
                        <div class="discount-badge">-${DISCOUNT_PERCENT}%</div>
                    </div>
                    <div class="quantity-input">
                        <button type="button" class="quantity-button" onclick="decreaseQuantity(${product.id})">-</button>
                        <input type="number" id="qty-${product.id}" name="qty-${product.id}" value="0" min="0" onchange="updateTotal()">
                        <button type="button" class="quantity-button" onclick="increaseQuantity(${product.id})">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function increaseQuantity(productId) {
            const input = document.getElementById(`qty-${productId}`);
            input.value = parseInt(input.value) + 1;
            updateTotal();
        }

        function decreaseQuantity(productId) {
            const input = document.getElementById(`qty-${productId}`);
            if (parseInt(input.value) > 0) {
                input.value = parseInt(input.value) - 1;
                updateTotal();
            }
        }

        function updateTotal() {
            let totalItems = 0;
            let totalPrice = 0;

            products.forEach(product => {
                const qty = parseInt(document.getElementById(`qty-${product.id}`).value) || 0;
                const discountedPrice = calculateDiscountedPrice(product.originalPrice);
                totalItems += qty;
                totalPrice += qty * discountedPrice;
            });

            document.getElementById('total-items').textContent = totalItems;
            document.getElementById('total-price').textContent = formatPrice(totalPrice);
            document.getElementById('final-price').textContent = formatPrice(totalPrice);
        }

        function validateForm() {
            const form = document.getElementById('verofit-form');
            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;

            requiredFields.forEach(field => {
                const formGroup = field.closest('.form-group');
                if (!field.value.trim()) {
                    formGroup.classList.add('error');
                    isValid = false;
                } else {
                    formGroup.classList.remove('error');
                }
            });

            // Check if at least one product is ordered
            let totalItems = 0;
            products.forEach(product => {
                const qty = parseInt(document.getElementById(`qty-${product.id}`).value) || 0;
                totalItems += qty;
            });

            if (totalItems === 0) {
                alert('Bitte bestellen Sie mindestens ein Produkt.');
                return false;
            }

            return isValid;
        }

        // Form submit
        document.getElementById('verofit-form').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!validateForm()) {
                alert('Bitte füllen Sie alle erforderlichen Felder aus.');
                return;
            }

            // Collect order data
            const orderData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                team: document.getElementById('team').value,
                email: document.getElementById('email').value,
                remarks: document.getElementById('remarks').value,
                items: [],
                totalPrice: document.getElementById('final-price').textContent
            };

            products.forEach(product => {
                const qty = parseInt(document.getElementById(`qty-${product.id}`).value) || 0;
                if (qty > 0) {
                    const discountedPrice = calculateDiscountedPrice(product.originalPrice);
                    orderData.items.push({
                        name: product.name,
                        quantity: qty,
                        price: formatPrice(discountedPrice),
                        total: formatPrice(qty * discountedPrice)
                    });
                }
            });

            // Log order data (in real application, send to server)
            console.log('Bestellung:', orderData);

            // Show success message
            alert(`Bestellung eingereicht!\n\nName: ${orderData.firstName} ${orderData.lastName}\nTeam: ${orderData.team}\nGesamtbetrag: ${orderData.totalPrice}`);

            // Reset form after 1 second
            setTimeout(() => {
                this.reset();
                renderProducts();
                updateTotal();
            }, 500);
        });

        // Initialize
        renderProducts();
        updateTotal();
    </script>
</body>
</html>
