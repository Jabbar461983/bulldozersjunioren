<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430">
  <defs>
    <path id="arcTop" d="M 55 260 A 245 205 0 0 1 545 260" />
    <path id="arcBottom" d="M 55 190 A 245 205 0 0 0 545 190" />
  </defs>

  <ellipse cx="300" cy="215" rx="288" ry="203" fill="#ffffff" stroke="#0e6e45" stroke-width="18"/>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="#0e6e45" letter-spacing="2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">STREETHOCKEYCLUB</textPath>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#0e6e45" letter-spacing="1">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">KERNENRIED &#8211; ZAUGGENRIED</textPath>
  </text>

  <g fill="#0e6e45">
    <path transform="translate(58,205)" d="M0,-16 L4.5,-5.5 16,-5 7,2.2 10,14 0,7 -10,14 -7,2.2 -16,-5 -4.5,-5.5 Z"/>
    <path transform="translate(542,205)" d="M0,-16 L4.5,-5.5 16,-5 7,2.2 10,14 0,7 -10,14 -7,2.2 -16,-5 -4.5,-5.5 Z"/>
  </g>

  <!-- Bulldozer emblem -->
  <g transform="translate(300,222)">
    <!-- shadow / body silhouette -->
    <path d="M -142 55 L -110 -10 L 120 -10 L 150 55 Z" fill="#0e6e45" opacity="0.55"/>

    <!-- cab -->
    <rect x="-72" y="-72" width="46" height="46" fill="#ffffff" stroke="#0e6e45" stroke-width="7"/>
    <rect x="-30" y="-40" width="10" height="34" fill="#0e6e45"/>
    <rect x="-33" y="-92" width="6" height="24" fill="#0e6e45"/>

    <!-- blade -->
    <path d="M -132 40 L -100 -30 L 128 -30 L 150 40 Z" fill="#b08d2a" stroke="#0e6e45" stroke-width="7"/>

    <!-- blade teeth -->
    <g fill="#0e6e45">
      <path d="M -132 40 L -122 40 L -127 55 Z"/>
      <path d="M -104 40 L -94 40 L -99 55 Z"/>
      <path d="M -76 40 L -66 40 L -71 55 Z"/>
      <path d="M -48 40 L -38 40 L -43 55 Z"/>
      <path d="M -20 40 L -10 40 L -15 55 Z"/>
      <path d="M 8 40 L 18 40 L 13 55 Z"/>
      <path d="M 36 40 L 46 40 L 41 55 Z"/>
      <path d="M 64 40 L 74 40 L 69 55 Z"/>
      <path d="M 92 40 L 102 40 L 97 55 Z"/>
      <path d="M 120 40 L 130 40 L 125 55 Z"/>
      <path d="M 143 40 L 150 40 L 147 55 Z"/>
    </g>

    <!-- wordmark on blade -->
    <text x="10" y="-2" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34"
          fill="#ffffff" stroke="#0e6e45" stroke-width="2" text-anchor="middle" letter-spacing="1">BULL</text>
    <text x="10" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34"
          fill="#ffffff" stroke="#0e6e45" stroke-width="2" text-anchor="middle" letter-spacing="1">DOZERS</text>

    <!-- hockey stick -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -52 -64 L -124 52" stroke="#ffffff" stroke-width="24"/>
      <path d="M -124 52 Q -136 72 -100 70 L -88 63" stroke="#ffffff" stroke-width="24"/>
      <path d="M -52 -64 L -124 52" stroke="#0e6e45" stroke-width="13"/>
      <path d="M -124 52 Q -136 72 -100 70 L -88 63" stroke="#0e6e45" stroke-width="13"/>
    </g>
  </g>
</svg>
